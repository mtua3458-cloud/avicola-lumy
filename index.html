<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avícola Lumy - Inicio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 26px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin: 15px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .btn-galpones {
            background-color: #15803d; /* Verde Esmeralda / Galpones */
            color: white;
        }
        .btn-huevos {
            background-color: #d97706; /* Ámbar / Huevos */
            color: white;
        }
        .btn-ventas {
            background-color: #2b6cb0; /* Azul / Ventas */
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>Avícola Lumy</h1>
        <p>Selecciona el módulo al que deseas ingresar:</p>
        
        <a href="./galpones/" class="btn btn-galpones">🏡 Módulo - Galpones</a>
        <a href="./huevos/" class="btn btn-huevos">🥚 Recolección de Huevos</a>
        <a href="./ventas/" class="btn btn-ventas">🛒 Módulo de Ventas</a>
    </div>

</body>
</html>
