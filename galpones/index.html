<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumy - Galpones | Control de Producción</title>
  
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            avicola: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' },
            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- 1. PANTALLA DE AUTENTICACIÓN (DISEÑO CORPORATIVO UNIFICADO) -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-950 via-avicola-900 to-slate-900">
    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-emerald-100/20">
      
      <!-- LOGO UNIFICADO CON MÓDULOS HERMANOS -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-emerald-800 via-emerald-600 to-emerald-400 text-white rounded-2xl shadow-xl shadow-emerald-950/40 border border-emerald-300/30 mb-4 transform hover:scale-105 transition-all duration-300">
          <i class="fa-solid fa-warehouse text-3xl drop-shadow-md text-emerald-50"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-800 tracking-tight">Lumy - Galpones</h1>
        <p class="text-xs font-extrabold text-emerald-600 uppercase tracking-widest mt-1">Módulo de Control de Producción</p>
      </div>

      <div class="flex border-b border-slate-200 mb-6 text-sm font-semibold">
        <button id="tab-btn-login" type="button" class="flex-1 py-2 text-center text-emerald-700 border-b-2 border-emerald-600 transition-colors font-bold">Iniciar Sesión</button>
        <button id="tab-btn-register" type="button" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors">Registrarse</button>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="email" id="login-email" required value="admin@lumy.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="login-password" required value="Admin123" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/35 transition-all flex items-center justify-center space-x-2 text-sm mt-2">
          <span>Ingresar al Sistema</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>

      <form id="register-form" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
          <input type="email" id="reg-email" placeholder="nuevo@avicolalumy.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm">
        </div>
        <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-lg text-sm">Crear Cuenta</button>
      </form>

    </div>
  </div>

  <!-- 2. PANTALLA PRINCIPAL / DASHBOARD -->
  <div id="app-screen" class="hidden min-h-screen flex-col bg-slate-100">
    <nav class="bg-gradient-to-r from-emerald-900 to-emerald-800 text-white shadow-md border-b border-emerald-700 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-amber-400 to-emerald-500 rounded-xl flex items-center justify-center text-slate-900 shadow-md">
              <i class="fa-solid fa-boxes-stacked text-lg"></i>
            </div>
            <div>
              <span class="font-extrabold text-lg tracking-wide text-white block leading-none">LUMY - GALPONES</span>
              <span class="text-[10px] text-emerald-200 tracking-wider uppercase">Sistema de Control Avícola (Cloud)</span>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <span id="nav-user-name" class="text-xs font-semibold text-emerald-100">Usuario</span>
            <button id="logout-btn" class="bg-red-500/20 hover:bg-red-600 text-red-100 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">Cerrar Sesión</button>
          </div>
        </div>
      </div>
    </nav
