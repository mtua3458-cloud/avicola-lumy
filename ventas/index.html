<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granja Avícola Lumy - Control de Ventas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased justify-between">

    <!-- ========================================== -->
    <!-- 1. PANTALLA DE AUTENTICACIÓN (LOGIN) -->
    <!-- ========================================== -->
    <section id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 w-full">
        <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-blue-100/20 text-slate-800">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-600 to-amber-500 text-white rounded-2xl shadow-lg mb-3">
                    <span class="text-3xl">🛒</span>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Granja Avícola Lumy</h1>
                <p class="text-xs font-semibold text-blue-600 mt-0.5">Control de Ventas</p>
            </div>

            <div class="flex border-b border-slate-200 mb-6 text-sm font-semibold">
                <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-center text-blue-700 border-b-2 border-blue-600 transition-colors">Iniciar Sesión</button>
                <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors">Registrarse</button>
                <button id="tab-btn-forgot" onclick="switchAuthTab('forgot')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors">Recuperar</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="username" required value="admin@lumy.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="password" required value="Admin123" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-slate-800">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm mt-2">Ingresar al Sistema</button>
            </form>

            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Nombre Completo</label>
                    <input type="text" id="regName" required placeholder="Ej: María Eugenia" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="regEmail" required placeholder="nuevo@lumy.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-sm mt-2">Crear Cuenta</button>
            </form>

            <form id="forgot-form" onsubmit="handleForgotPassword(event)" class="space-y-4 hidden">
                <p class="text-xs text-slate-500 mb-2">Ingresa tu correo registrado para recibir instrucciones.</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="forgotEmail" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <button type="submit" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm mt-2">Enviar Instrucciones</button>
            </form>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- 2. PANTALLA PRINCIPAL (DASHBOARD)          -->
    <!-- ========================================== -->
    <div id="dashboardScreen" class="hidden flex-col min-h-screen bg-slate-950 w-full">
        
        <header class="bg-slate-900 border-b border-blue-500/30 shadow-lg sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white font-bold text-xl shadow-md flex items-center justify-center w-10 h-10">🛒</div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wide text-blue-400 leading-none">Granja Avícola Lumy</h1>
                        <p class="text-xs text-slate-400 mt-0.5">Control de Ventas</p>
                    </div>
                </div>

                <!-- BOTONES DE INFORMES POR TIEMPO -->
                <div class="flex flex-wrap items-center gap-1.5">
                    <div class="inline-flex items-center space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                        <button onclick="printReport('day')" class="px-2 py-1.5 hover:bg-slate-800 font-semibold rounded-lg text-slate-200 transition">Día</button>
                        <button onclick="printReport('week')" class="px-2 py-1.5 hover:bg-slate-800 font-semibold rounded-lg text-slate-200 transition">Semana</button>
                        <button onclick="printReport('month')" class="px-2 py-1.5 hover:bg-slate-800 font-semibold rounded-lg text-slate-200 transition">Mes</button>
                        <button onclick="printReport('year')" class="px-2 py-1.5 hover:bg-slate-800 font-semibold rounded-lg text-slate-200 transition">Año</button>
                        <button onclick="printReport('all')" class="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow transition">Todo</button>
                    </div>
                    <button onclick="logout()" class="bg-red-500/20 hover:bg-red-600 text-red-200 hover:text-white border border-red-500/30 text-xs px-3 py-2 rounded-xl transition font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-power-off"></i>
                        <span>Salir</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-6xl mx-auto px-4 py-6 w-full space-y-6">

            <!-- TARJETAS DE RESUMEN -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase">Cajas Tipo A Disponibles</p>
                        <h3 id="statStock" class="text-2xl font-black text-amber-400 mt-1">0</h3>
                    </div>
                    <div class="w-10 h-10 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl">📦</div>
                </div>

                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase">Ventas / Salidas</p>
                        <h3 id="statSales" class="text-2xl font-black text-emerald-400 mt-
