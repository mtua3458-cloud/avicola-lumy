    <!-- 3. LÓGICA Y CONEXIÓN REAL A LA NUBE (SUPABASE) -->
    <!-- ========================================== -->
    <script>
        const SUPABASE_URL = 'https://yufrelqaqyeslnnzzltir.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cMEeoD8C86l2BEN19TwC-w_WuOBvFcC';
        
        let _supabase = null;
        try {
            if (window.supabase) {
                const { createClient } = supabase;
                _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (err) {
            console.error('Error inicializando Supabase:', err);
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const forgotForm = document.getElementById('forgot-form');

            const btnLogin = document.getElementById('tab-btn-login');
            const btnRegister = document.getElementById('tab-btn-register');
            const btnForgot = document.getElementById('tab-btn-forgot');

            loginForm.classList.add('hidden');
            registerForm.classList.add('hidden');
            forgotForm.classList.add('hidden');

            [btnLogin, btnRegister, btnForgot].forEach(btn => {
                btn.className = "flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors";
            });

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                btnLogin.className = "flex-1 py-2 text-center text-blue-700 border-b-2 border-blue-600 transition-colors font-bold";
            } else if (tab === 'register') {
                registerForm.classList.remove('hidden');
                btnRegister.className = "flex-1 py-2 text-center text-amber-600 border-b-2 border-amber-500 transition-colors font-bold";
            } else if (tab === 'forgot') {
                forgotForm.classList.remove('hidden');
                btnForgot.className = "flex-1 py-2 text-center text-slate-800 border-b-2 border-slate-700 transition-colors font-bold";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            showDashboard();
        }

        function handleRegister(e) {
            e.preventDefault();
            alert('¡Cuenta registrada con éxito! Ya puedes ingresar.');
            switchAuthTab('login');
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            alert('Se han enviado las instrucciones a tu correo electrónico.');
            switchAuthTab('login');
        }

        function showDashboard() {
            const loginScreen = document.getElementById('loginScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            if (loginScreen) {
                loginScreen.classList.add('hidden');
                loginScreen.style.display = 'none';
            }
            if (dashboardScreen) {
                dashboardScreen.classList.remove('hidden');
                dashboardScreen.classList.add('flex');
                dashboardScreen.style.display = 'flex';
            }
            loadCloudData();
        }

        function logout() {
            const loginScreen = document.getElementById('loginScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            if (dashboardScreen) {
                dashboardScreen.classList.add('hidden');
                dashboardScreen.style.display = 'none';
            }
            if (loginScreen) {
                loginScreen.classList.remove('hidden');
                loginScreen.style.display = 'flex';
            }
        }

        // --- CARGAR DATOS DESDE SUPABASE CLOUD ---
        async function loadCloudData() {
            if (!_supabase) {
                console.warn("Supabase no está disponible.");
                updateUI([], []);
                return;
            }

            try {
                const [transRes, credRes] = await Promise.all([
                    _supabase.from('lumy_transactions').select('*').order('id', { ascending: false }),
                    _supabase.from('lumy_credits').select('*').order('id', { ascending: false })
                ]);

                let transactions = transRes.data || [];
                let credits = credRes.data || [];

                updateUI(transactions, credits);
            } catch (err) {
                console.error("Error al sincronizar con la nube:", err);
            }
        }

        // --- GUARDAR TRANSACCIÓN EN LA NUBE ---
        async function handleTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('transType').value;
            
            const qtyA = parseInt(document.getElementById('transQtyA').value) || 0;
            const priceA = parseFloat(document.getElementById('transPriceA').value) || 0;
            
            const qtyJumbo = parseInt(document.getElementById('transQtyJumbo').value) || 0;
            const priceJumbo = parseFloat(document.getElementById('transPriceJumbo').value) || 0;

            if (qtyA === 0 && qtyJumbo === 0) {
                alert('Por favor ingresa al menos una cantidad para Tipo A o Tipo Jumbo.');
                return;
            }

            const total = (qtyA * priceA) + (qtyJumbo * priceJumbo);
            
            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                type: type,
                qtyA: qtyA,
                priceA: priceA,
                qtyJumbo: qtyJumbo,
                priceJumbo: priceJumbo,
                total: total
            };

            if (_supabase) {
                const { error } = await _supabase.from('lumy_transactions').insert([newRecord]);
                if (error) {
                    console.error("Error guardando en Supabase:", error);
                    alert("Error al guardar en la nube. Verifica tu conexión.");
                    return;
                }
            }

            e.target.reset();
            loadCloudData();
            alert('¡Operación guardada en la nube con éxito!');
        }

        // --- GUARDAR CRÉDITO EN LA NUBE ---
        async function handleCreditSale(e) {
            e.preventDefault();
            const client = document.getElementById('creditClient').value;
            
            const qtyA = parseInt(document.getElementById('creditQtyA').value) || 0;
            const priceA = parseFloat(document.getElementById('creditPriceA').value) || 0;
            
            const qtyJumbo = parseInt(document.getElementById('creditQtyJumbo').value) || 0;
            const priceJumbo = parseFloat(document.getElementById('creditPriceJumbo').value) || 0;

            if (qtyA === 0 && qtyJumbo === 0) {
                alert('Por favor ingresa al menos una cantidad para Tipo A o Tipo Jumbo en el crédito.');
                return;
            }

            const total = (qtyA * priceA) + (qtyJumbo * priceJumbo);
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 5);

            const newCredit = {
                id: Date.now(),
                client: client,
                qtyA: qtyA,
                priceA: priceA,
                qtyJumbo: qtyJumbo,
                priceJumbo: priceJumbo,
                total: total,
                dueDate: dueDate.getTime(),
                status: 'pending'
            };

            if (_supabase) {
                const { error } = await _supabase.from('lumy_credits').insert([newCredit]);
                if (error) {
                    console.error("Error guardando crédito en Supabase:", error);
                    alert("Error al guardar el crédito en la nube.");
                    return;
                }
            }

            e.target.reset();
            loadCloudData();
            alert('¡Venta a crédito guardada en la nube! Plazo de 5 días.');
        }

        // --- ELIMINAR DE LA NUBE ---
        async function deleteTransaction(id) {
            if (confirm('¿Deseas eliminar esta operación de la nube?')) {
                if (_supabase) {
                    await _supabase.from('lumy_transactions').delete().eq('id', id);
                }
                loadCloudData();
            }
        }

        // --- COBRAR CRÉDITO EN LA NUBE ---
        async function payCredit(id) {
            if (_supabase) {
                const { data: creds } = await _supabase.from('lumy_credits').select('*').eq('id', id);
                if (creds && creds.length > 0) {
                    const credit = creds[0];
                    
                    await _supabase.from('lumy_credits').update({ status: 'paid' }).eq('id', id);

                    const saleRecord = {
                        id: Date.now(),
                        date: new Date().toLocaleString(),
                        type: 'sale',
                        qtyA: credit.qtyA,
                        priceA: credit.priceA,
                        qtyJumbo: credit.qtyJumbo,
                        priceJumbo: credit.priceJumbo,
                        total: credit.total
                    };
                    await _supabase.from('lumy_transactions').insert([saleRecord]);
                }
            }
            loadCloudData();
            alert('¡Crédito cobrado y registrado como venta en la nube!');
        }

        // --- ACTUALIZAR INTERFAZ CON DATOS DE LA NUBE ---
        function updateUI(transactions = [], credits = []) {
            let totalStockA = 0;
            let totalStockJumbo = 0;
            let totalSalesCount = 0;
            let totalRevenueVal = 0;
            let pendingCreditsCount = 0;

            transactions.forEach(t => {
                if (t.type === 'entry') {
                    totalStockA += t.qtyA;
                    totalStockJumbo += t.qtyJumbo;
                } else if (t.type === 'sale') {
                    totalStockA -= t.qtyA;
                    totalStockJumbo -= t.qtyJumbo;
                    totalSalesCount += (t.qtyA + t.qtyJumbo);
                    totalRevenueVal += t.total;
                }
            });

            credits.forEach(c => {
                if (c.status === 'pending') {
                    pendingCreditsCount++;
                }
            });

            document.getElementById('statStock').innerText = `A: ${totalStockA} | J: ${totalStockJumbo}`;
            document.getElementById('statSales').innerText = totalSalesCount;
            document.getElementById('statRevenue').innerText = `$${totalRevenueVal.toFixed(2)}`;
            document.getElementById('statCreditsPending').innerText = pendingCreditsCount;

            // Renderizar Historial
            const historyBody = document.getElementById('historyTable');
            if (historyBody) {
                historyBody.innerHTML = '';
                if (transactions.length === 0) {
                    historyBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">No hay operaciones en la nube.</td></tr>`;
                } else {
                    transactions.forEach(t => {
                        const badge = t.type === 'entry' 
                            ? '<span class="bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded text-[10px] font-bold">ENTRADA</span>' 
                            : '<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold">VENTA</span>';

                        historyBody.innerHTML += `
                            <tr class="hover:bg-slate-950/40 transition">
                                <td class="p-3 text-slate-400">${t.date}</td>
                                <td class="p-3">${badge}</td>
                                <td class="p-3 font-semibold">${t.qtyA} un. ($${t.priceA.toFixed(2)})</td>
                                <td class="p-3 font-semibold">${t.qtyJumbo} un. ($${t.priceJumbo.toFixed(2)})</td>
                                <td class="p-3 font-bold text-blue-400">$${t.total.toFixed(2)}</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteTransaction(${t.id})" class="bg-red-500/20 hover:bg-red-600 text-red-300 hover:text-white px-2 py-1 rounded text-xs transition">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            }

            // Renderizar Créditos
            const creditsBody = document.getElementById('creditsTable');
            if (creditsBody) {
                creditsBody.innerHTML = '';
                if (credits.length === 0) {
                    creditsBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">No hay créditos en la nube.</td></tr>`;
                } else {
                    const now = Date.now();
                    credits.forEach(c => {
                        const timeLeft = c.dueDate - now;
                        let timeStr = '';
                        let statusBadge = '';

                        if (c.status === 'paid') {
                            statusBadge = '<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold">PAGADO</span>';
                            timeStr = 'Completado';
                        } else if (timeLeft <= 0) {
                            statusBadge = '<span class="bg-red-500/20 text-red-400 px-2 py-0.5 rounded text-[10px] font-bold">VENCIDO</span>';
                            timeStr = 'Plazo expirado';
                        } else {
                            statusBadge = '<span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded text-[10px] font-bold">PENDIENTE</span>';
                            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            timeStr = `${days} días, ${hours} hrs`;
                        }

                        const actionBtn = c.status === 'pending' 
                            ? `<button onclick="payCredit(${c.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-bold transition">Cobrar / Pagar</button>`
                            : '<span class="text-slate-500 text-xs">N/A</span>';

                        creditsBody.innerHTML += `
                            <tr class="hover:bg-slate-950/40 transition">
                                <td class="p-3 font-bold text-slate-200">${c.client}</td>
                                <td class="p-3">A: ${c.qtyA} ($${c.priceA}) | Jumbo: ${c.qtyJumbo} ($${c.priceJumbo})</td>
                                <td class="p-3 font-bold text-amber-400">$${c.total.toFixed(2)}</td>
                                <td class="p-3 text-slate-400">${new Date(c.dueDate).toLocaleDateString()}</td>
                                <td class="p-3 font-semibold text-blue-300">${timeStr}</td>
                                <td class="p-3 text-center space-x-2">
                                    ${statusBadge}
                                    ${actionBtn}
                                </td>
                            </tr>
                        `;
                    });
                }
            }
        }

        // IMPRESIÓN OFICIAL CON DATOS DE LA NUBE
        async function printReport(type) {
            if (!_supabase) return;
            const { data: transactions = [] } = await _supabase.from('lumy_transactions').select('*');

            let titleText = "INFORME HISTÓRICO COMPLETO DE VENTAS Y CAJAS";
            let totalRevenueVal = 0;
            let totalA = 0;
            let totalJumbo = 0;

            transactions.forEach(t => {
                if (t.type === 'sale') {
                    totalRevenueVal += t.total;
                    totalA += t.qtyA;
                    totalJumbo += t.qtyJumbo;
                }
            });

            const currentDate = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            let rowsHtml = '';
            if (transactions.length === 0) {
                rowsHtml = `<tr><td colspan="5" style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; color: #64748b; font-style: italic;">Sin movimientos en la nube.</td></tr>`;
            } else {
                transactions.forEach(item => {
                    rowsHtml += `
                        <tr>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px;">${item.date}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center;">${item.type.toUpperCase()}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center;">${item.qtyA} un. ($${item.priceA.toFixed(2)})</td>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center;">${item.qtyJumbo} un. ($${item.priceJumbo.toFixed(2)})</td>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; text-align: right; font-weight: bold; color: #16a34a;">$${item.total.toFixed(2)}</td>
                        </tr>
                    `;
                });
            }

            const printWindow = window.open('', '_blank', 'width=850,height=650');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>${titleText}</title>
                    <style>
                        body { font-family: system-ui, -apple-system, sans-serif; color: #1e293b; padding: 25px; margin: 0; background: #fff; }
                        .header { text-align: center; border-bottom: 2px solid #2563eb; padding-bottom: 12px; margin-bottom: 20px; }
                        h1 { font-size: 20px; font-weight: 900; color: #1e3a8a; margin: 0; letter-spacing: 0.5px; }
                        h2 { font-size: 11px; font-weight: 800; color: #334155; margin: 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
                        h3 { font-size: 11px; font-weight: 800; color: #d97706; margin: 2px 0; text-transform: uppercase; }
                        p { font-size: 10px; color: #64748b; margin: 0; font-weight: 500; }
                        .section-title { font-size: 11px; font-weight: 800; color: #1e293b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
                        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 20px; }
                        th { background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; font-weight: 700; }
                        td { border: 1px solid #cbd5e1; padding: 6px 8px; }
                        .total-box { width: 100%; border: 1.5px solid #2563eb; margin-top: 15px; border-collapse: collapse; }
                        .total-box td { padding: 10px; font-weight: 800; font-size: 12px; }
                        .footer { margin-top: 40px; text-align: center; font-size: 9px; color: #64748b; border-top: 1px dashed #cbd5e1; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>GRANJA AVÍCOLA LUMY</h1>
                        <h2>SISTEMA DE CONTROL DE VENTAS Y CAJAS DE HUEVOS</h2>
                        <h3>${titleText}</h3>
                        <p>Fecha de emisión: ${currentDate}</p>
                    </div>

                    <div class="section-title">1. RESUMEN GENERAL DE CAJAS COMERCIALIZADAS</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Concepto / Tipo de Huevo</th>
                                <th style="text-align: center;">Cantidad Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Total Cajas Comercializadas (Tipo A)</td>
                                <td style="text-align: center; font-weight: bold; color: #16a34a;">${totalA} Cajas</td>
                            </tr>
                            <tr>
                                <td>Total Cajas Comercializadas (Tipo Jumbo)</td>
                                <td style="text-align: center; font-weight: bold; color: #16a34a;">${totalJumbo} Cajas</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="section-title">2. DETALLE DE HISTORIAL DE VENTAS Y ENTRADAS</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th style="text-align: center;">Operación</th>
                                <th style="text-align: center;">Cajas Tipo A</th>
                                <th style="text-align: center;">Cajas Tipo Jumbo</th>
                                <th style="text-align: right;">Total ($)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>

                    <table class="total-box">
                        <tr style="background: #f8fafc;">
                            <td style="color: #1e3a8a; border: none;">TOTAL RECAUDADO EN VENTAS DEL PERÍODO:</td>
                            <td style="text-align: right; color: #16a34a; font-size: 14px; border: none;">$${totalRevenueVal.toFixed(2)}</td>
                        </tr>
                    </table>

                    <div class="footer">
                        Granja Avícola Lumy &copy; 2026 - Reporte generado automáticamente por el Sistema de Gestión de Ventas.
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();

            setTimeout(() => {
                printWindow.focus();
                printWindow.print();
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCloudData();
        });
    </script>
