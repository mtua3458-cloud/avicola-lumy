<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granja Avícola Lumy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased justify-between">

    <!-- ========================================== -->
    <!-- 1. PANTALLA DE LOGIN -->
    <!-- ========================================== -->
    <section id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 w-full">
        <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-blue-100/20 text-slate-800">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-600 to-amber-500 text-white rounded-2xl shadow-lg mb-3">
                    <span class="text-3xl">🥚</span>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Granja Avícola Lumy</h1>
                <p class="text-xs font-semibold text-blue-600 mt-0.5">Sistema de Control</p>
            </div>

            <div class="flex border-b border-slate-200 mb-6 text-sm font-semibold">
                <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-center text-blue-700 border-b-2 border-blue-600 transition-colors">Iniciar Sesión</button>
                <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors">Registrarse</button>
                <button id="tab-btn-forgot" onclick="switchAuthTab('forgot')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors">Recuperar</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="username" required value="admin@lumy.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="password" required value="Admin123" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-slate-800">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm mt-2">Ingresar al Sistema</button>
            </form>

            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Nombre Completo</label>
                    <input type="text" id="regName" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="regEmail" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-sm mt-2">Crear Cuenta</button>
            </form>

            <form id="forgot-form" onsubmit="handleForgotPassword(event)" class="space-y-4 hidden">
                <p class="text-xs text-slate-500 mb-2">Ingresa tu correo para recuperar el acceso.</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Correo</label>
                    <input type="email" id="forgotEmail" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800">
                </div>
                <button type="submit" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm mt-2">Enviar Instrucciones</button>
            </form>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- 2. PANTALLA PRINCIPAL (DASHBOARD) -->
    <!-- ========================================== -->
    <div id="dashboardScreen" class="hidden flex-col min-h-screen bg-slate-950 w-full">
        <header class="bg-slate-900 border-b border-blue-500/30 shadow-lg sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-lg font-bold text-blue-400">Granja Avícola Lumy</h1>
                <button onclick="logout()" class="bg-red-500/20 hover:bg-red-600 text-red-200 text-xs px-3 py-2 rounded-xl transition font-semibold">Salir</button>
            </div>
        </header>

        <main class="flex-grow max-w-6xl mx-auto px-4 py-6 w-full space-y-6">
            <!-- TARJETAS DE ESTadísticas -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs font-semibold text-slate-400">Stock Actual</p>
                    <h3 id="statStock" class="text-2xl font-black text-amber-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs font-semibold text-slate-400">Ventas Registradas</p>
                    <h3 id="statSales" class="text-2xl font-black text-emerald-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs font-semibold text-slate-400">Total Recaudado</p>
                    <h3 id="statRevenue" class="text-2xl font-black text-blue-400 mt-1">$0.00</h3>
                </div>
            </div>

            <!-- TABLA DE HISTORIAL -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-md overflow-hidden">
                <div class="p-4 bg-slate-950/60 border-b border-slate-800">
                    <h3 class="text-sm font-bold text-blue-400">Historial de Operaciones</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-800">
                            <tr>
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Tipo</th>
                                <th class="p-3">Cantidad</th>
                                <th class="p-3">Total</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable" class="divide-y divide-slate-800/60 text-slate-300">
                            <!-- Datos dinámicos -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- 3. LÓGICA Y CABLEADO (JS) CORREGIDA -->
    <!-- ========================================== -->
    <script>
        const SUPABASE_URL = 'https://yufrelqaqyeslnnzzltir.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cMEeoD8C86l2BEN19TwC-w_WuOBvFcC';
        
        let _supabase = null;
        try {
            if (window.supabase) {
                const { createClient } = supabase;
                _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (err) {
            console.error('Error inicializando Supabase:', err);
        }

        let localCredits = JSON.parse(localStorage.getItem('lumy_credits') || '[]');
        let globalTransactionsList = JSON.parse(localStorage.getItem('lumy_transactions') || '[]');

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const forgotForm = document.getElementById('forgot-form');

            if(loginForm) loginForm.classList.add('hidden');
            if(registerForm) registerForm.classList.add('hidden');
            if(forgotForm) forgotForm.classList.add('hidden');

            if (tab === 'login' && loginForm) loginForm.classList.remove('hidden');
            if (tab === 'register' && registerForm) registerForm.classList.remove('hidden');
            if (tab === 'forgot' && forgotForm) forgotForm.classList.remove('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            showDashboard();
        }

        function handleRegister(e) {
            e.preventDefault();
            alert('¡Cuenta registrada con éxito! Ya puedes ingresar.');
            switchAuthTab('login');
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            alert('Se han enviado las instrucciones a tu correo electrónico.');
            switchAuthTab('login');
        }

        function showDashboard() {
            const loginScreen = document.getElementById('loginScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            if (loginScreen) {
                loginScreen.classList.add('hidden');
                loginScreen.style.display = 'none';
            }
            if (dashboardScreen) {
                dashboardScreen.classList.remove('hidden');
                dashboardScreen.classList.add('flex');
                dashboardScreen.style.display = 'flex';
            }
            updateUI();
        }

        function logout() {
            const loginScreen = document.getElementById('loginScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            if (dashboardScreen) {
                dashboardScreen.classList.add('hidden');
                dashboardScreen.style.display = 'none';
            }
            if (loginScreen) {
                loginScreen.classList.remove('hidden');
                loginScreen.style.display = 'flex';
            }
        }

        function updateUI() {
            const historyBody = document.getElementById('historyTable');
            if (historyBody) {
                historyBody.innerHTML = '';
                if (globalTransactionsList.length === 0) {
                    historyBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500 italic">No hay operaciones registradas.</td></tr>`;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });
    </script>
</body>
</html>
