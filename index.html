<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avícola Lumy - Gestión de Cajas</title>
    
    <!-- Enlace al archivo Manifest para PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3014/3014523.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

    <!-- CABECERA PRINCIPAL -->
    <header class="bg-zinc-900 border-b border-amber-500/25 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 p-2 rounded-lg text-zinc-950 font-bold text-xl shadow">
                    🥚
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-amber-400">Avícola Lumy</h1>
                    <p class="text-xs text-zinc-400">Control & Registro de Cajas de Huevos</p>
                </div>
            </div>
            <button id="logoutBtn" onclick="logout()" class="hidden bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 text-xs px-3 py-1.5 rounded-lg transition">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-6 w-full">

        <!-- PANTALLA 1: LOGIN -->
        <section id="loginScreen" class="max-w-md mx-auto bg-zinc-900 p-6 rounded-2xl shadow-xl border border-zinc-800">
            <h2 class="text-lg font-bold text-amber-400 mb-4 text-center">Acceso al Sistema</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Usuario / Correo</label>
                    <input type="email" id="username" required placeholder="admin@lumy.com" class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold py-2.5 rounded-lg text-sm shadow transition">
                    Ingresar
                </button>
            </form>
            <div class="mt-4 text-center">
                <p class="text-xs text-zinc-400">¿No tienes una cuenta? <button onclick="toggleRegisterModal(true)" class="text-amber-400 font-semibold hover:underline">Regístrate gratis</button></p>
            </div>
        </section>

        <!-- MODAL: CREAR NUEVA CUENTA -->
        <div id="registerModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="text-md font-bold text-amber-400">Crear Nueva Cuenta</h3>
                    <button onclick="toggleRegisterModal(false)" class="text-zinc-500 hover:text-zinc-300 font-bold text-lg">&times;</button>
                </div>
                <form onsubmit="handleRegister(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Nombre Completo</label>
                        <input type="text" id="regName" required placeholder="Ej: Nombre y Apellido" class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Correo Electrónico</label>
                        <input type="email" id="regEmail" required placeholder="correo@ejemplo.com" class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Contraseña</label>
                        <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="button" onclick="toggleRegisterModal(false)" class="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2 rounded-lg text-sm transition">
                            Cancelar
                        </button>
                        <button type="submit" class="w-1/2 bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold py-2 rounded-lg text-sm shadow transition">
                            Registrarse
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- PANTALLA 2: DASHBOARD Y REGISTROS (Protegida) -->
        <section id="dashboardScreen" class="hidden space-y-6">
            
            <!-- TARJETAS DE RESUMEN DE STOCK -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex items-center justify-between shadow-sm">
                    <div>
                        <p class="text-xs font-semibold text-zinc-400">Cajas Disponibles</p>
                        <h3 id="statStock" class="text-2xl font-bold text-amber-400">0</h3>
                    </div>
                    <span class="text-2xl">📦</span>
                </div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex items-center justify-between shadow-sm">
                    <div>
                        <p class="text-xs font-semibold text-zinc-400">Ventas Realizadas</p>
                        <h3 id="statSales" class="text-2xl font-bold text-emerald-400">0</h3>
                    </div>
                    <span class="text-2xl">💰</span>
                </div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex items-center justify-between shadow-sm">
                    <div>
                        <p class="text-xs font-semibold text-zinc-400">Total Recaudado</p>
                        <h3 id="statRevenue" class="text-2xl font-bold text-zinc-200">$0.00</h3>
                    </div>
                    <span class="text-2xl">📊</span>
                </div>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-md">
                <h3 class="text-md font-bold text-amber-400 mb-4 flex items-center gap-2">
                    <span>📝</span> Registrar Operación de Cajas
                </h3>
                <form onsubmit="handleTransaction(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Tipo de Movimiento</label>
                        <select id="transType" required class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:ring-2 focus:ring-amber-500 outline-none">
                            <option value="entry">Entrada (Inventario)</option>
