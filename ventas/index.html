    <script>
        const SUPABASE_URL = 'https://yufrelqaqyeslnnzzltir.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cMEeoD8C86l2BEN19TwC-w_WuOBvFcC';
        
        let _supabase = null;
        try {
            if (window.supabase) {

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const forgotForm = document.getElementById('forgot-form');

            const btnLogin = document.getElementById('tab-btn-login');
            const btnRegister = document.getElementById('tab-btn-register');
            const btnForgot = document.getElementById('tab-btn-forgot');

            if(loginForm) loginForm.classList.add('hidden');
            if(registerForm) registerForm.classList.add('hidden');
            if(forgotForm) forgotForm.classList.add('hidden');

            [btnLogin, btnRegister, btnForgot].forEach(btn => {
                if(btn) btn.className = "flex-1 py-2 text-center text-slate-400 hover:text-slate-600 transition-colors";
            });

            if (tab === 'login' && loginForm) {
                loginForm.classList.remove('hidden');
                if(btnLogin) btnLogin.className = "flex-1 py-2 text-center text-blue-700 border-b-2 border-blue-600 transition-colors font-bold";
            } else if (tab === 'register' && registerForm) {
                registerForm.classList.remove('hidden');
                if(btnRegister) btnRegister.className = "flex-1 py-2 text-center text-amber-600 border-b-2 border-amber-500 transition-colors font-bold";
            } else if (tab === 'forgot' && forgotForm) {
                forgotForm.classList.remove('hidden');
                if(btnForgot) btnForgot.className = "flex-1 py-2 text-center text-slate-800 border-b-2 border-slate-700 transition-colors font-bold";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            showDashboard();
        }

        function handleRegister(e) {
            e.preventDefault();
            alert('¡Cuenta registrada con éxito! Ya puedes ingresar.');
            switchAuthTab('login');
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            alert('Se han enviado las instrucciones a tu correo electrónico.');
            switchAuthTab('login');
        }

        function showDashboard() {
            const loginScreen = document.getElementById('loginScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            if (loginScreen) {
                loginScreen.classList.add('hidden');
                loginScreen.style.display = 'none';
            }
            if (dashboardScreen) {
                dashboardScreen.classList.remove('hidden');
                dashboardScreen.classList.add('flex');
                dashboardScreen.style.display = 'flex';
            }
            loadDataSafely();
        }

        function logout() {
            const loginScreen = document.getElementById('loginScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            if (dashboardScreen) {
                dashboardScreen.classList.add('hidden');
                dashboardScreen.style.display = 'none';
            }
            if (loginScreen) {
                loginScreen.classList.remove('hidden');
                loginScreen.style.display = 'flex';
            }
        }

        // --- CARGA SEGURA SIN RIESGO DE PANTALLA EN BLANCO ---
        async function loadDataSafely() {
            let transactions = [];
            let credits = [];

            // Intentar sincronizar con Supabase si las tablas existen
            if (_supabase) {
                try {
                    const [transRes, credRes] = await Promise.all([
                        _supabase.from('lumy_transactions').select('*').order('id', { ascending: false }),
                        _supabase.from('lumy_credits').select('*').order('id', { ascending: false })
                    ]);
                    
                    if (transRes.data && transRes.data.length > 0) transactions = transRes.data;
                    if (credRes.data && credRes.data.length > 0) credits = credRes.data;
                } catch (err) {
                    console.warn("Aviso de sincronización en nube, usando respaldo local seguro.");
                }
            }

            // Respaldo automático local para garantizar que NUNCA quede vacío
            if (transactions.length === 0) {
                transactions = JSON.parse(localStorage.getItem('lumy_transactions') || '[]');
            }
            if (credits.length === 0) {
                credits = JSON.parse(localStorage.getItem('lumy_credits') || '[]');
            }

            updateUI(transactions, credits);
        }

        // --- GUARDAR TRANSACCIÓN ---
        async function handleTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('transType').value;
            const qtyA = parseInt(document.getElementById('transQtyA').value) || 0;
            const priceA = parseFloat(document.getElementById('transPriceA').value) || 0;
            const qtyJumbo = parseInt(document.getElementById('transQtyJumbo').value) || 0;
            const priceJumbo = parseFloat(document.getElementById('transPriceJumbo').value) || 0;

            if (qtyA === 0 && qtyJumbo === 0) {
                alert('Por favor ingresa al menos una cantidad para Tipo A o Tipo Jumbo.');
                return;
            }

            const total = (qtyA * priceA) + (qtyJumbo * priceJumbo);
            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                type: type,
                qtyA: qtyA,
                priceA: priceA,
                qtyJumbo: qtyJumbo,
                priceJumbo: priceJumbo,
                total: total
            };

            // Guardar local
            let localTrans = JSON.parse(localStorage.getItem('lumy_transactions') || '[]');
            localTrans.unshift(newRecord);
            localStorage.setItem('lumy_transactions', JSON.stringify(localTrans));

            // Intentar guardar en Supabase
            if (_supabase) {
                try {
                    await _supabase.from('lumy_transactions').insert([newRecord]);
                } catch (err) {
                    console.error("Error guardando en nube:", err);
                }
            }

            e.target.reset();
            loadDataSafely();
            alert('¡Operación registrada con éxito!');
        }

        // --- GUARDAR CRÉDITO ---
        async function handleCreditSale(e) {
            e.preventDefault();
            const client = document.getElementById('creditClient').value;
            const qtyA = parseInt(document.getElementById('creditQtyA').value) || 0;
            const priceA = parseFloat(document.getElementById('creditPriceA').value) || 0;
            const qtyJumbo = parseInt(document.getElementById('creditQtyJumbo').value) || 0;
            const priceJumbo = parseFloat(document.getElementById('creditPriceJumbo').value) || 0;

            if (qtyA === 0 && qtyJumbo === 0) {
                alert('Por favor ingresa al menos una cantidad para Tipo A o Tipo Jumbo en el crédito.');
                return;
            }

            const total = (qtyA * priceA) + (qtyJumbo * priceJumbo);
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 5);

            const newCredit = {
                id: Date.now(),
                client: client,
                qtyA: qtyA,
                priceA: priceA,
                qtyJumbo: qtyJumbo,
                priceJumbo: priceJumbo,
                total: total,
                dueDate: dueDate.getTime(),
                status: 'pending'
            };

            let localCreds = JSON.parse(localStorage.getItem('lumy_credits') || '[]');
            localCreds.unshift(newCredit);
            localStorage.setItem('lumy_credits', JSON.stringify(localCreds));

            if (_supabase) {
                try {
                    await _supabase.from('lumy_credits').insert([newCredit]);
                } catch (err) {
                    console.error("Error guardando crédito en nube:", err);
                }
            }

            e.target.reset();
            loadDataSafely();
            alert('¡Venta a crédito registrada con éxito! Plazo de 5 días.');
        }

        async function deleteTransaction(id) {
            if (confirm('¿Deseas eliminar esta operación?')) {
                let localTrans = JSON.parse(localStorage.getItem('lumy_transactions') || '[]');
                localTrans = localTrans.filter(t => t.id !== id);
                localStorage.setItem('lumy_transactions', JSON.stringify(localTrans));

                if (_supabase) {
                    try {
                        await _supabase.from('lumy_transactions').delete().eq('id', id);
                    } catch (e) {}
                }
                loadDataSafely();
            }
        }

        async function payCredit(id) {
            let localCreds = JSON.parse(localStorage.getItem('lumy_credits') || '[]');
            const credit = localCreds.find(c => c.id === id);
            
            if (credit) {
                credit.status = 'paid';
                localStorage.setItem('lumy_credits', JSON.stringify(localCreds));

                const saleRecord = {
                    id: Date.now(),
                    date: new Date().toLocaleString(),
                    type: 'sale',
                    qtyA: credit.qtyA,
                    priceA: credit.priceA,
                    qtyJumbo: credit.qtyJumbo,
                    priceJumbo: credit.priceJumbo,
                    total: credit.total
                };

                let localTrans = JSON.parse(localStorage.getItem('lumy_transactions') || '[]');
                localTrans.unshift(saleRecord);
                localStorage.setItem('lumy_transactions', JSON.stringify(localTrans));

                if (_supabase) {
                    try {
                        await _supabase.from('lumy_credits').update({ status: 'paid' }).eq('id', id);
                        await _supabase.from('lumy_transactions').insert([saleRecord]);
                    } catch (e) {}
                }

                loadDataSafely();
                alert('¡Crédito cobrado y registrado como venta!');
            }
        }

        // --- ACTUALIZAR INTERFAZ ---
        function updateUI(transactions = [], credits = []) {
            let totalStockA = 0;
            let totalStockJumbo = 0;
            let totalSalesCount = 0;
            let totalRevenueVal = 0;
            let pendingCreditsCount = 0;

            transactions.forEach(t => {
                if (t.type === 'entry') {
                    totalStockA += (t.qtyA || 0);
                    totalStockJumbo += (t.qtyJumbo || 0);
                } else if (t.type === 'sale') {
                    totalStockA -= (t.qtyA || 0);
                    totalStockJumbo -= (t.qtyJumbo || 0);
                    totalSalesCount += ((t.qtyA || 0) + (t.qtyJumbo || 0));
                    totalRevenueVal += (t.total || 0);
                }
            });

            credits.forEach(c => {
                if (c.status === 'pending') {
                    pendingCreditsCount++;
                }
            });

            const statStock = document.getElementById('statStock');
            const statSales = document.getElementById('statSales');
            const statRevenue = document.getElementById('statRevenue');
            const statCreditsPending = document.getElementById('statCreditsPending');

            if(statStock) statStock.innerText = `A: ${totalStockA} \vert{} J:${totalStockJumbo}`;
            if(statSales) statSales.innerText = totalSalesCount;
            if(statRevenue) statRevenue.innerText = `$${totalRevenueVal.toFixed(2)}`;
            if(statCreditsPending) statCreditsPending.innerText = pendingCreditsCount;

            // Historial
            const historyBody = document.getElementById('historyTable');
            if (historyBody) {
                historyBody.innerHTML = '';
                if (transactions.length === 0) {
                    historyBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">No hay operaciones registradas.</td></tr>`;
                } else {
                    transactions.forEach(t => {
                        const badge = t.type === 'entry' 
                            ? '<span class="bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded text-[10px] font-bold">ENTRADA</span>' 
                            : '<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold">VENTA</span>';

                        historyBody.innerHTML += `
                            <tr class="hover:bg-slate-950/40 transition">
                                <td class="p-3 text-slate-400">${t.date || ''}</td>
                                <td class="p-3">${badge}</td>
                                <td class="p-3 font-semibold">${t.qtyA \vert{}\vert{} 0} un. ($${(t.priceA || 0).toFixed(2)})</td>
                                <td class="p-3 font-semibold">${t.qtyJumbo || 0} un. ($${(t.priceJumbo \vert{}\vert{} 0).toFixed(2)})</td> <td class="p-3 font-bold text-blue-400">$${(t.total || 0).toFixed(2)}</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteTransaction(${t.id})" class="bg-red-500/20 hover:bg-red-600 text-red-300 hover:text-white px-2 py-1 rounded text-xs transition">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            }

            // Créditos
            const creditsBody = document.getElementById('creditsTable');
            if (creditsBody) {
                creditsBody.innerHTML = '';
                if (credits.length === 0) {
                    creditsBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">No hay créditos registrados.</td></tr>`;
                } else {
                    const now = Date.now();
                    credits.forEach(c => {
                        const timeLeft = (c.dueDate || now) - now;
                        let timeStr = '';
                        let statusBadge = '';

                        if (c.status === 'paid') {
                            statusBadge = '<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold">PAGADO</span>';
                            timeStr = 'Completado';
                        } else if (timeLeft <= 0) {
                            statusBadge = '<span class="bg-red-500/20 text-red-400 px-2 py-0.5 rounded text-[10px] font-bold">VENCIDO</span>';
                            timeStr = 'Plazo expirado';
                        } else {
                            statusBadge = '<span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded text-[10px] font-bold">PENDIENTE</span>';
                            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            timeStr = `${days} días, ${hours} hrs`;
                        }

                        const actionBtn = c.status === 'pending' 
                            ? `<button onclick="payCredit(${c.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-bold transition">Cobrar / Pagar</button>`
                            : '<span class="text-slate-500 text-xs">N/A</span>';

                        creditsBody.innerHTML += `
                            <tr class="hover:bg-slate-950/40 transition">
                                <td class="p-3 font-bold text-slate-200">${c.client || ''}</td>
                                <td class="p-3">A: ${c.qtyA \vert{}\vert{} 0} ($${c.priceA \vert{}\vert{} 0}) \vert{} Jumbo:${c.qtyJumbo || 0} ($${c.priceJumbo \vert{}\vert{} 0})</td> <td class="p-3 font-bold text-amber-400">$${(c.total || 0).toFixed(2)}</td>
                                <td class="p-3 text-slate-400">${new Date(c.dueDate || now).toLocaleDateString()}</td>
                                <td class="p-3 font-semibold text-blue-300">${timeStr}</td>
                                <td class="p-3 text-center space-x-2">
                                    ${statusBadge}${actionBtn}
                                </td>
                            </tr>
                        `;
                    });
                }
            }
        }
